<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCEBA7" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8E6B15" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="400" cy="300" r="220" fill="none" stroke="#1F2E4F" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="400" cy="300" r="160" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6" />
  
  <!-- Regal Equestrian Emblem & Crest -->
  <path d="M400 160 L430 220 L500 230 L450 280 L460 350 L400 320 L340 350 L350 280 L300 230 L370 220 Z" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4" />
  
  <!-- Stylized Stallion Silhouette -->
  <path d="M360 380 C350 330 380 280 410 240 C430 210 420 180 450 160 C465 150 480 170 470 190 C490 190 510 210 500 230 C490 245 470 250 460 270 C450 290 455 330 460 380 Z" fill="url(#gold)" filter="url(#glow)" opacity="0.9"/>
  
  <text x="400" y="470" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="#F8F4EA" text-anchor="middle" letter-spacing="4">HERITAGE OF THE STALLION</text>
  <text x="400" y="510" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#8D9BB0" text-anchor="middle" letter-spacing="2">ESTABLISHED 1924 &bull; CENTURY OF ENDURANCE</text>
</svg>

