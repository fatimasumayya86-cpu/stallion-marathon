  <text x="400" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#D4AF37" text-anchor="middle" letter-spacing="2">EXTREME ELEVATION &bull; UNSPOILED NATURE &bull; RAW GRIT</text>
